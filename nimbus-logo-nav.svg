<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 54" role="img" aria-label="Nimbus">
  <title>Nimbus</title>

  <!-- ── COMPACT CLOUD ICON (left, scaled down) ── -->
  <g fill="#2B6B28">
    <circle cx="16"  cy="30" r="9"/>
    <circle cx="25"  cy="24" r="11.5"/>
    <circle cx="37"  cy="21" r="13"/>
    <circle cx="49"  cy="24" r="10.5"/>
    <circle cx="13"  cy="33" r="7"/>
    <!-- bottom fill -->
    <rect x="10" y="27" width="51" height="13" rx="2"/>
  </g>

  <!-- ── NFC arcs (inline compact) ── -->
  <path d="M 47,14 A 8,8  0 0,1 60,22" fill="none" stroke="#2B6B28" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 46,9  A 13,13 0 0,1 65,22" fill="none" stroke="#2B6B28" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 45,4  A 18,18 0 0,1 70,22" fill="none" stroke="#2B6B28" stroke-width="2.8" stroke-linecap="round"/>

  <!-- ── NIMBUS text ── -->
  <text x="80" y="38"
        font-family="'Arial Black','Impact','Franklin Gothic Heavy','Helvetica Neue',sans-serif"
        font-weight="900"
        font-size="30"
        fill="#0F172A"
        letter-spacing="-0.5">NIMBUS</text>
</svg>
