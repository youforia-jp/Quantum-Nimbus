<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 390" role="img" aria-label="Nimbus — A Cryptographic Authentication Brand">
  <title>Nimbus</title>

  <!-- ── CLOUD BODY (forest green, multiple circles for fluffy shape) ── -->
  <g fill="#2B6B28">
    <circle cx="88"  cy="178" r="46"/>
    <circle cx="138" cy="148" r="58"/>
    <circle cx="200" cy="130" r="65"/>
    <circle cx="262" cy="148" r="54"/>
    <circle cx="70"  cy="192" r="34"/>
    <!-- fill bottom gap -->
    <rect x="60" y="165" width="258" height="60" rx="4"/>
  </g>

  <!-- ── NFC SIGNAL ARCS (upper-right of cloud, 3 concentric arcs) ── -->
  <!-- Center of arcs anchored at approx (278, 168) — top-right edge of cloud -->
  <!-- Arc 1 – inner (r≈42) -->
  <path d="M 255,127 A 42,42 0 0,1 320,149"
        fill="none" stroke="#2B6B28" stroke-width="11" stroke-linecap="round"/>
  <!-- Arc 2 – middle (r≈68) -->
  <path d="M 247,103 A 68,68 0 0,1 346,151"
        fill="none" stroke="#2B6B28" stroke-width="11" stroke-linecap="round"/>
  <!-- Arc 3 – outer (r≈95) -->
  <path d="M 238,78  A 95,95 0 0,1 373,155"
        fill="none" stroke="#2B6B28" stroke-width="11" stroke-linecap="round"/>

  <!-- ── NIMBUS ── -->
  <text x="0" y="318"
        font-family="'Arial Black','Impact','Franklin Gothic Heavy','Helvetica Neue',sans-serif"
        font-weight="900"
        font-size="110"
        fill="#000000"
        letter-spacing="-1">NIMBUS</text>

  <!-- ── TAGLINE ── -->
  <text x="3" y="358"
        font-family="Arial,Helvetica,sans-serif"
        font-weight="400"
        font-size="16.5"
        fill="#1a1a1a"
        letter-spacing="3.8">A CRYPTOGRAPHIC AUTHENTICATION BRAND</text>
</svg>
