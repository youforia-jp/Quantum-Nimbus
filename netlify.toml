# Local Netlify Configuration mimicking production environment
[build]
  functions = "netlify/functions"
  # Uncomment the line below to completely disable automatic Netlify builds on push.
  # ignore = "exit 0"

[dev]
  port = 8888
  publish = "."

# Non-secret local dev settings. NIMBUS_NFC_MASTER_SECRET must be set via a local
# .env file (gitignored) or the Netlify dashboard, not committed here.
[context.development.environment]
  NIMBUS_API_URL = "http://localhost:8888/api"
  NIMBUS_DEV_MODE = "true"

# Example redirect rules for clean routing redirects
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/simulator"
  to = "/simulator.html"
  status = 200

[[redirects]]
  from = "/safety"
  to = "/safety.html"
  status = 200

[[redirects]]
  from = "/v"
  to = "/v.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/unit-economics"
  to = "/unit-economics.html"
  status = 200

[[redirects]]
  from = "/how-it-works"
  to = "/how-it-works.html"
  status = 200

[[redirects]]
  from = "/state-auditor-dashboard"
  to = "/state-auditor-dashboard.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200


# Security Headers Configuration for A+ rating on SecurityHeaders.com
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://images.unsplash.com https://cdn.shopify.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://unpkg.com https://cdn.jsdelivr.net; connect-src 'self' https://formspree.io https://*.supabase.co https://*.basemaps.cartocdn.com https://cdn.jsdelivr.net https://unpkg.com; frame-ancestors 'none'; form-action 'self' https://formspree.io; base-uri 'self'; object-src 'none';"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"


