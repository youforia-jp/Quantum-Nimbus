# Local Netlify Configuration mimicking production environment
[build]
  # To completely prevent automatic Netlify builds on push, uncomment the line below.
  # This tells Netlify to skip any automated build execution.
  ignore = "exit 0"

[dev]
  port = 8888
  # Mimic target port for local developer server (e.g., if using python -m http.server 8080)
  targetPort = 8080
  publish = "."

# Inject mock environment variables for local testing
[context.development.environment]
  NIMBUS_API_URL = "http://localhost:8888/api"
  NIMBUS_DEV_MODE = "true"
  NIMBUS_NFC_MASTER_SECRET = "nimbus_secure_master_secret_2026_local"

# Example redirect rules for clean routing redirects
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
